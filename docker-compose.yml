services:
  mysql:
    image: mysql:8.4
    container_name: edm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: edm_root_password
      MYSQL_DATABASE: external_data_manager
      MYSQL_USER: edm
      MYSQL_PASSWORD: edm_password
    ports:
      - "3306:3306"
    volumes:
      - edm-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:8.0
    container_name: edm-redis
    ports:
      - "6379:6379"
    volumes:
      - edm-redis-data:/data

volumes:
  edm-mysql-data:
  edm-redis-data:
